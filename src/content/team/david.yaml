name: Daniel
role: Co-founder and Chief Operating Officer
about: >
  Dan has 12 years of experience in pharmaceutical operations, spanning production, quality control, and supply chain, with roles at Amgen, Oxford Biomedica, and Ascend GCTx. Specialising in GMP CAPEX projects, facility start-ups, process development, scale-up, technology transfer, vendor management, and validation, Dan has a proven track record of introducing new GMP capabilities and building specialised teams to achieve impactful results.
